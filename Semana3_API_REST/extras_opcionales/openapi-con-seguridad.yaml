# openapi-con-seguridad.yaml
# Versión del contrato con seguridad declarada (Bearer/JWT + 401, 403 y 429).
# Es OPCIONAL: el taller no exige autenticación. Generada a partir de openapi.yaml.
openapi: 3.0.3
info:
  title: Orders API
  version: 1.1.0
  description: 'API para la gestión de pedidos.

    Contrato de integración entre el Sistema de Gestión de Pedidos (proveedor)

    y la aplicación web de comercio electrónico (consumidor).

    '
servers:
- url: http://localhost:8080
  description: Servidor local (backend real o mock)
tags:
- name: Orders
  description: Operaciones sobre pedidos
paths:
  /orders:
    post:
      tags:
      - Orders
      summary: Crear un pedido
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              customerId: C-1024
              items:
              - productId: P-500
                quantity: 2
      responses:
        '201':
          description: Pedido creado
          headers:
            Location:
              description: URI del pedido creado
              schema:
                type: string
              example: /orders/O-9831
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: O-9831
                customerId: C-1024
                status: CREATED
                total: 129.9
                items:
                - productId: P-500
                  quantity: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: No se puede procesar el pedido (por ejemplo, sin stock)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PRODUCT_NOT_AVAILABLE
                message: Product P-500 does not have sufficient stock
                correlationId: ab23f8b1-91c2-45dc
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
      - Orders
      summary: Buscar pedidos
      operationId: listOrders
      parameters:
      - name: customerId
        in: query
        required: false
        description: Devuelve solo los pedidos de este cliente
        schema:
          type: string
        example: C-1024
      responses:
        '200':
          description: Lista de pedidos (puede estar vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}:
    parameters:
    - name: orderId
      in: path
      required: true
      description: Identificador del pedido
      schema:
        type: string
      example: O-9831
    get:
      tags:
      - Orders
      summary: Consultar un pedido
      operationId: getOrder
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: O-9831
                customerId: C-1024
                status: CREATED
                total: 129.9
                items:
                - productId: P-500
                  quantity: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - Orders
      summary: Modificar parcialmente un pedido (por ejemplo, cancelarlo)
      operationId: updateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
            example:
              status: CANCELLED
      responses:
        '200':
          description: Pedido actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: O-9831
                customerId: C-1024
                status: CANCELLED
                total: 129.9
                items:
                - productId: P-500
                  quantity: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El estado actual del pedido no permite el cambio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ORDER_NOT_MODIFIABLE
                message: Order O-9831 is already cancelled
                correlationId: 7d1c0e52-44aa-41b1
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    BadRequest:
      description: Solicitud inválida (datos faltantes o con formato incorrecto)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_REQUEST
            message: customerId is required
            correlationId: 3f2a9c10-0b7e-4d55
    NotFound:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: ORDER_NOT_FOUND
            message: Order O-0000 was not found
            correlationId: 9be1a7c4-5521-4f0a
    InternalError:
      description: Falla inesperada del servicio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Unexpected error. Use the correlationId to report it
            correlationId: c04d77b2-91ee-4a63
    Unauthorized:
      description: 'No autenticado: falta el token o es inválido o está vencido'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Missing or invalid token
            correlationId: e5a1c0de-7b21-4f90
    Forbidden:
      description: Autenticado, pero sin permiso sobre este recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: You do not have access to this order
            correlationId: 1b9d3f6a-20cc-4e7d
    TooManyRequests:
      description: Se superó el límite de solicitudes
      headers:
        Retry-After:
          description: Segundos a esperar antes de reintentar
          schema:
            type: integer
          example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: TOO_MANY_REQUESTS
            message: Rate limit exceeded
            correlationId: 6c2e8b19-aa03-4d12
  schemas:
    OrderItem:
      type: object
      required:
      - productId
      - quantity
      properties:
        productId:
          type: string
          example: P-500
        quantity:
          type: integer
          minimum: 1
          example: 2
    CreateOrderRequest:
      type: object
      required:
      - customerId
      - items
      properties:
        customerId:
          type: string
          example: C-1024
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
    UpdateOrderRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - CREATED
          - PAID
          - CANCELLED
          example: CANCELLED
    Order:
      type: object
      properties:
        id:
          type: string
          example: O-9831
        customerId:
          type: string
          example: C-1024
        status:
          type: string
          enum:
          - CREATED
          - PAID
          - CANCELLED
        total:
          type: number
          format: double
          example: 129.9
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Código estable pensado para máquinas
          example: PRODUCT_NOT_AVAILABLE
        message:
          type: string
          description: Mensaje pensado para personas
          example: Product P-500 does not have sufficient stock
        correlationId:
          type: string
          description: Identificador para rastrear la petición entre sistemas
          example: ab23f8b1-91c2-45dc
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT en la cabecera Authorization: Bearer <token>'
security:
- bearerAuth: []
