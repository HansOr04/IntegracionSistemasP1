openapi: 3.0.3                       # versión de la especificación OpenAPI
info:
  title: Orders API
  version: 1.0.0
  description: |
    API para la gestión de pedidos.
    Contrato de integración entre el Sistema de Gestión de Pedidos (proveedor)
    y la aplicación web de comercio electrónico (consumidor).
servers:
  - url: http://localhost:8080
    description: Servidor local (backend real o mock)
tags:
  - name: Orders
    description: Operaciones sobre pedidos

paths:
  /orders:
    post:                              # POST sobre la colección = crear
      tags: [Orders]
      summary: Crear un pedido
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              customerId: C-1024
              items:
                - productId: P-500
                  quantity: 2
      responses:
        '201':
          description: Pedido creado
          headers:
            Location:
              description: URI del pedido creado
              schema:
                type: string
              example: /orders/O-9831
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: O-9831
                customerId: C-1024
                status: CREATED
                total: 129.90
                items:
                  - productId: P-500
                    quantity: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':                         # regla de negocio incumplida
          description: No se puede procesar el pedido (por ejemplo, sin stock)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PRODUCT_NOT_AVAILABLE
                message: Product P-500 does not have sufficient stock
                correlationId: ab23f8b1-91c2-45dc
        '500':
          $ref: '#/components/responses/InternalError'
    get:                               # GET sobre la colección = buscar
      tags: [Orders]
      summary: Buscar pedidos
      operationId: listOrders
      parameters:
        - name: customerId
          in: query                    # query parameter: filtra
          required: false
          description: Devuelve solo los pedidos de este cliente
          schema:
            type: string
          example: C-1024
      responses:
        '200':
          description: Lista de pedidos (puede estar vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path                       # path parameter: identifica el recurso
        required: true
        description: Identificador del pedido
        schema:
          type: string
        example: O-9831
    get:
      tags: [Orders]
      summary: Consultar un pedido
      operationId: getOrder
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: O-9831
                customerId: C-1024
                status: CREATED
                total: 129.90
                items:
                  - productId: P-500
                    quantity: 2
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:                             # PATCH = modificación parcial
      tags: [Orders]
      summary: Modificar parcialmente un pedido (por ejemplo, cancelarlo)
      operationId: updateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
            example:
              status: CANCELLED
      responses:
        '200':
          description: Pedido actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: O-9831
                customerId: C-1024
                status: CANCELLED
                total: 129.90
                items:
                  - productId: P-500
                    quantity: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El estado actual del pedido no permite el cambio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ORDER_NOT_MODIFIABLE
                message: Order O-9831 is already cancelled
                correlationId: 7d1c0e52-44aa-41b1
        '500':
          $ref: '#/components/responses/InternalError'

components:                            # elementos reutilizables
  responses:
    BadRequest:
      description: Solicitud inválida (datos faltantes o con formato incorrecto)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_REQUEST
            message: customerId is required
            correlationId: 3f2a9c10-0b7e-4d55
    NotFound:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: ORDER_NOT_FOUND
            message: Order O-0000 was not found
            correlationId: 9be1a7c4-5521-4f0a
    InternalError:
      description: Falla inesperada del servicio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Unexpected error. Use the correlationId to report it
            correlationId: c04d77b2-91ee-4a63
  schemas:
    OrderItem:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          example: P-500
        quantity:
          type: integer
          minimum: 1
          example: 2
    CreateOrderRequest:
      type: object
      required: [customerId, items]
      properties:
        customerId:
          type: string
          example: C-1024
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
    UpdateOrderRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [CREATED, PAID, CANCELLED]
          example: CANCELLED
    Order:
      type: object
      properties:
        id:
          type: string
          example: O-9831
        customerId:
          type: string
          example: C-1024
        status:
          type: string
          enum: [CREATED, PAID, CANCELLED]
        total:
          type: number
          format: double
          example: 129.90
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    Error:                             # modelo común de error
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estable pensado para máquinas
          example: PRODUCT_NOT_AVAILABLE
        message:
          type: string
          description: Mensaje pensado para personas
          example: Product P-500 does not have sufficient stock
        correlationId:
          type: string
          description: Identificador para rastrear la petición entre sistemas
          example: ab23f8b1-91c2-45dc
